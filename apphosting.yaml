# Settings to manage and configure a Firebase App Hosting backend.
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  # Set a higher timeout to accommodate server-side rendering and AI flows.
  timeoutSeconds: 60
  # Increase this value to automatically spin up more instances for traffic.
  maxInstances: 10
  # Keep at least one instance running to reduce cold starts.
  minInstances: 1

# --- Show YouTube videos automatically (no code edits) ---
# 1. On YouTube, create a public playlist and add your event videos to it.
# 2. Copy the playlist ID (the text after "list=" in its URL) and uncomment below.
# 3. Redeploy once. After that, any video you add to the playlist appears on the
#    website within about an hour.
# env:
#   - variable: YOUTUBE_PLAYLIST_ID
#     value: PLxxxxxxxxxxxxxxxxxxxxxxxx
